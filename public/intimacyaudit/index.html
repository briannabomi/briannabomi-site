<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A private, self-guided diagnostic. Find the pattern blocking what you actually want.">
<title>The Intimacy Audit · Sex by Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --void:#171015; --room:#1F1721; --sunk:#120C11;
  /* Contrast-checked against --void, --room and --sunk.
     --cream/--dim/--brass/--rose clear 7:1 (AAA). --faint clears 5.5:1.
     Nothing on this page falls below WCAG AA. */
  --cream:#F0E7E0; --dim:#B0A1A9; --faint:#9A8F96;
  --rose:#D49590; --rose-d:#B0736E; --brass:#C59E69;
  --line:rgba(240,231,224,.19); --line-2:rgba(240,231,224,.10);
  --glow:rgba(208,140,134,.55);
  --disp:'Fraunces',Georgia,serif; --body:'Karla',system-ui,sans-serif;
  --lit:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--void);color:var(--cream);font-family:var(--body);line-height:1.6;
  -webkit-font-smoothing:antialiased;padding:0 20px 90px;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;transition:opacity 1.1s ease;
  opacity:calc(.25 + var(--lit) * .75);
  background:radial-gradient(ellipse 980px 660px at 50% -10%, rgba(208,140,134,.15), transparent 68%),
             radial-gradient(ellipse 720px 520px at 86% 26%, rgba(195,154,99,.09), transparent 70%)}
.wrap{max-width:640px;margin:0 auto;position:relative;z-index:1}
.wrap.wide{max-width:920px}

.rail{position:fixed;left:34px;top:50%;transform:translateY(-50%);z-index:6;display:none}
@media(min-width:1200px){.rail{display:block}}
.rail .track{width:2px;height:200px;background:var(--line);position:relative;border-radius:2px}
.rail .track i{position:absolute;left:0;bottom:0;width:2px;border-radius:2px;
  background:linear-gradient(to top,var(--brass),var(--rose));transition:height .7s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 12px var(--glow)}
.rail .cap{writing-mode:vertical-rl;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--faint);margin-top:16px}

h1{font-family:var(--disp);font-weight:400;font-size:clamp(38px,7.6vw,58px);line-height:1.03;
  letter-spacing:-.022em;font-variation-settings:'SOFT' 20,'WONK' 1}
h1 em{font-style:italic;color:var(--rose)}
h2{font-family:var(--disp);font-weight:400;font-size:clamp(27px,5vw,38px);line-height:1.16;
  letter-spacing:-.018em;font-variation-settings:'SOFT' 20}
h3{font-family:var(--disp);font-weight:500;font-size:24px;letter-spacing:-.012em}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass);font-weight:600}
.lede{color:var(--dim);font-size:16.5px;font-weight:400;line-height:1.68}
.tiny{font-size:13.5px;color:var(--faint);line-height:1.6}
p+p{margin-top:14px}

header{text-align:center;padding:54px 0 30px}
header.compact{padding:34px 0 22px}
header.compact h1{font-size:clamp(24px,4vw,31px)}
header .sub{max-width:34em;margin:20px auto 0;color:var(--dim);font-size:17px;
  font-weight:400;line-height:1.6}
.age{display:inline-block;margin-top:22px;font-size:10.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--faint);border:1px solid var(--line);
  border-radius:100px;padding:7px 15px}
.mark{width:44px;height:44px;margin:0 auto 20px;border:1px solid var(--line);border-radius:50%;
  display:grid;place-items:center;font-family:var(--disp);font-style:italic;font-size:19px;color:var(--rose)}
.brand{font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--faint);margin-bottom:22px}
.card{background:var(--room);border:1px solid var(--line);border-radius:6px;
  padding:clamp(26px,5.2vw,42px);margin-bottom:20px}
footer{text-align:center;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--faint);
  padding-top:32px;line-height:2.2}
.hr{height:1px;background:var(--line);margin:30px 0}

.build{display:flex;align-items:center;gap:18px;margin-bottom:24px;
  border:1px solid var(--line);border-radius:6px;padding:13px 18px;background:rgba(255,255,255,.012)}
.build .mk{width:52px;height:40px;flex:none;filter:drop-shadow(0 0 9px rgba(208,140,134,.35))}
.build .meta{flex:1;min-width:0}
.build .st{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.build .st b{font-family:var(--disp);font-style:italic;font-weight:400;font-size:15px;color:var(--cream)}
.build .st span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.build .bar{height:2px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.build .bar i{position:absolute;left:0;top:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--brass),var(--rose));transition:width .55s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 9px var(--glow)}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:15px;width:100%;text-align:left;cursor:pointer;
  font-family:var(--body);font-size:15.5px;line-height:1.5;color:var(--cream);
  background:#181119;border:1px solid var(--line);border-radius:5px;padding:17px 19px;
  transition:border-color .22s, background .22s, color .22s, transform .18s, box-shadow .28s}
.opt:hover{border-color:var(--faint);color:var(--cream);transform:translateX(3px)}
.opt.on{border-color:var(--rose);color:var(--cream);background:rgba(208,140,134,.075);
  box-shadow:0 0 26px -9px var(--glow), inset 0 0 22px -14px var(--glow)}
.opt:focus-visible{outline:1px solid var(--brass);outline-offset:3px}
.opt .txt{flex:1}
.opt .txt b{display:block;font-weight:500;font-size:15.5px;color:inherit}
.opt .txt s{display:block;text-decoration:none;font-size:13.5px;color:var(--dim);margin-top:5px;
  line-height:1.5;font-weight:400}
.opt.on .txt s{color:var(--dim)}
.node{width:19px;height:19px;flex:none;margin-top:2px;border:1.5px solid var(--faint);
  border-radius:50%;position:relative;transition:border-color .22s}
.node.sq{border-radius:5px}
.node::after{content:"";position:absolute;inset:4px;border-radius:inherit;background:transparent;
  transition:background .22s, box-shadow .22s}
.opt:hover .node{border-color:var(--dim)}
.opt.on .node{border-color:var(--rose)}
.opt.on .node::after{background:var(--rose);box-shadow:0 0 12px 3px var(--glow)}
.pickhint{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  margin-bottom:15px;display:flex;align-items:center;gap:9px}
.pickhint::before{content:"";width:16px;height:1px;background:var(--faint)}
.grouplab{display:block;font-family:var(--disp);font-weight:400;font-size:22px;letter-spacing:-.012em;
  color:var(--cream);margin-bottom:13px}

.btn{display:block;width:100%;cursor:pointer;font-family:var(--body);font-size:12.5px;letter-spacing:.2em;
  text-transform:uppercase;font-weight:700;padding:20px;border:1px solid var(--rose);border-radius:4px;
  background:var(--rose);color:#1B1017;transition:.24s;margin-top:30px;text-align:center;text-decoration:none;
  box-shadow:0 0 30px -8px var(--glow)}
.btn:hover{background:var(--rose-d);border-color:var(--rose-d);box-shadow:0 0 40px -5px var(--glow);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--dim);border-color:var(--line);box-shadow:none;font-weight:600}
.btn.ghost:hover{color:var(--cream);border-color:var(--rose-d);box-shadow:0 0 26px -10px var(--glow);transform:none}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#211705;
  box-shadow:0 0 30px -8px rgba(195,154,99,.6)}
.btn.brass:hover{background:#B0873F;border-color:#B0873F;box-shadow:0 0 42px -5px rgba(195,154,99,.75)}
.btn .ico{display:inline-block;vertical-align:-3px;margin-right:10px}
.back{background:none;border:none;cursor:pointer;font-family:var(--body);font-size:12px;color:var(--faint);
  padding:17px 0 0;width:100%;letter-spacing:.06em}
.back:hover{color:var(--dim)}
.skip{background:none;border:none;cursor:pointer;font-family:var(--body);font-size:12px;color:var(--faint);
  text-decoration:underline;text-underline-offset:3px;padding:13px 0 0;width:100%}

input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;
  padding:14px 15px;font-family:var(--body);font-size:16px;color:var(--cream);outline:none;transition:.2s}
input:focus{border-color:var(--rose);box-shadow:0 0 22px -12px var(--glow)}
input::placeholder{color:var(--faint)}
label{display:block;font-size:15px;font-weight:500;margin-bottom:10px;color:var(--cream)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:520px){.row{grid-template-columns:1fr}}

.priv{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:100px;padding:7px 15px}
.priv b{width:5px;height:5px;border-radius:50%;background:var(--rose);display:block;box-shadow:0 0 9px 2px var(--glow)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0}
@media(max-width:520px){.pair{grid-template-columns:1fr}}
.pair>div{border:1px solid var(--line);border-radius:5px;padding:20px}
.pair .n{font-family:var(--disp);font-style:italic;font-size:16px;color:var(--brass);margin-bottom:9px}
.pair p{font-size:14.5px;color:var(--dim);line-height:1.5}
.banner{border:1px solid var(--line);border-left:2px solid var(--rose);border-radius:4px;
  padding:18px 21px;margin-bottom:30px;background:rgba(208,140,134,.045)}
.qblock{margin-bottom:34px;padding-bottom:34px;border-bottom:1px solid var(--line-2)}
.qblock:last-of-type{border:none;padding-bottom:0;margin-bottom:0}

/* ══ video ══ */
.vidwrap{position:relative;width:100%;padding-top:56.25%;border-radius:6px;overflow:hidden;
  background:var(--sunk);border:1px solid var(--line);margin-bottom:24px}
.vidwrap iframe,.vidwrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
/* Shorts / Reels are 9:16. Given a 16:9 frame they pillarbox into two black
   bars, so vertical video gets its own frame and is centred rather than
   stretched across the column. */
.vidwrap.portrait{padding-top:min(177.8%,600px);max-width:338px;margin-left:auto;margin-right:auto}
.vidph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at center,rgba(208,140,134,.10),transparent 70%)}
.vidph .pl{width:66px;height:66px;border-radius:50%;border:1.5px solid var(--rose);display:grid;
  place-items:center;margin:0 auto 16px;box-shadow:0 0 30px -6px var(--glow)}
.vidph .pl::after{content:"";width:0;height:0;border-left:17px solid var(--rose);
  border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.vidph p{font-size:13px;color:var(--faint);letter-spacing:.06em}

/* ══ results ══ */
.hgrid{display:grid;grid-template-columns:.88fr 1.12fr;gap:20px;margin-bottom:20px}
@media(max-width:880px){.hgrid{grid-template-columns:1fr}}
.acard{background:var(--room);border:1px solid var(--line);border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column}
.acard .top{background:linear-gradient(172deg,rgba(208,140,134,.19),rgba(208,140,134,.04));
  padding:26px 24px 0;text-align:center;position:relative}
.acard .top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:26px;background:var(--room);
  clip-path:polygon(0 62%,26% 30%,58% 66%,100% 26%,100% 100%,0 100%)}
.acard .kick{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.acard .nm{font-family:var(--disp);font-style:italic;font-weight:400;font-size:clamp(30px,4.4vw,38px);
  color:var(--cream);line-height:1.08;margin-bottom:6px}
.acard .tg{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);font-weight:700;
  margin-bottom:4px}
.acard svg.plate{width:100%;max-width:224px;height:auto;display:block;margin:0 auto;position:relative;z-index:2}
.acard .bot{padding:10px 26px 28px;text-align:center;flex:1;display:flex;flex-direction:column}
.acard .bot p{font-family:var(--disp);font-style:italic;font-size:17.5px;color:var(--dim);line-height:1.5;
  margin-bottom:auto}
.tcard{background:var(--room);border:1px solid var(--line);border-radius:6px;padding:clamp(24px,4vw,34px)}

.tr{margin-bottom:28px} .tr:last-child{margin-bottom:0}
.tr .cal{text-align:center;font-size:15px;margin-bottom:9px;color:var(--cream)}
.tr .cal b{font-family:var(--disp);font-style:italic;font-weight:500;color:var(--rose);font-size:19px}
.tr .bar{display:flex;align-items:center;gap:12px}
.tr .end{font-size:12.5px;color:var(--faint);flex:none;width:78px}
.tr .end.r{text-align:left} .tr .end.l{text-align:right}
.tr .tk{flex:1;height:9px;border-radius:9px;background:var(--sunk);border:1px solid var(--line-2);position:relative}
.tr .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;
  background:linear-gradient(90deg,var(--brass),var(--rose));transition:width 1.2s cubic-bezier(.3,.8,.3,1)}
.tr .tk u{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--cream);
  border:2.5px solid var(--rose);transform:translate(-50%,-50%);box-shadow:0 0 12px var(--glow);
  transition:left 1.2s cubic-bezier(.3,.8,.3,1)}
.tr .note{font-size:13px;color:var(--dim);margin-top:10px;padding-left:90px;line-height:1.45}
@media(max-width:560px){.tr .end{width:62px;font-size:11.5px} .tr .note{padding-left:0;text-align:center}}

.tri{display:grid;gap:12px}
.tri .t{border:1px solid var(--line);border-radius:5px;padding:20px 22px;display:flex;gap:16px;align-items:flex-start}
.tri .t .no{font-family:var(--disp);font-style:italic;font-size:19px;color:var(--brass);flex:none;line-height:1.3}
.tri .t p{font-size:15.5px;color:var(--cream);line-height:1.55}
.blk{margin-bottom:30px} .blk:last-child{margin-bottom:0}
.blk .sh{font-family:var(--disp);font-weight:500;font-size:21px;color:var(--brass);margin-bottom:11px;
  letter-spacing:-.01em}
.blk p{font-size:16px;color:var(--dim);line-height:1.66;font-weight:400}
.hl{border:1px solid var(--rose-d);border-radius:5px;padding:26px 28px;background:rgba(208,140,134,.05);
  box-shadow:0 0 34px -18px var(--glow)}
.hl .sh{color:var(--rose)} .hl p{color:var(--cream)}
.box{border:1px solid var(--line);border-radius:5px;padding:24px 26px;margin-top:22px}
.box .eyebrow{margin-bottom:12px;display:block}
.letter{font-family:var(--disp);font-weight:300;font-size:19px;line-height:1.74;color:var(--cream);
  font-variation-settings:'SOFT' 30}
.letter p+p{margin-top:18px}
.sig{font-family:var(--disp);font-style:italic;font-size:18px;color:var(--rose);margin-top:24px}
.proof{border-top:1px solid var(--line);margin-top:28px;padding-top:22px;font-size:15px;color:var(--dim);
  font-style:italic;line-height:1.6}
.shot{border-top:1px solid var(--line);margin-top:30px;padding-top:26px}
.shot .cap{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);
  margin-bottom:16px;display:flex;align-items:center;gap:9px}
.shot .cap::before{content:"";width:16px;height:1px;background:var(--faint)}
.shot figure{margin:0;max-width:390px}
.shot img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);
  background:#000}
.shot figcaption{margin-top:14px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--faint)}
@media print{.shot{display:none}}
.proof b{display:block;font-style:normal;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--faint);margin-top:11px}
.mini{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
.mini:last-child{border:none}
.mini .nm{color:var(--dim);min-width:126px}
.mini .tk{flex:1;height:3px;background:var(--line);border-radius:3px;position:relative}
.mini .tk i{position:absolute;left:0;top:0;height:3px;border-radius:3px;background:var(--faint)}
.mini.top .nm{color:var(--cream)} .mini.top .tk i{background:var(--rose);box-shadow:0 0 9px var(--glow)}
.mini em{font-style:normal;font-size:11.5px;color:var(--faint);min-width:26px;text-align:right}

.load{text-align:center;padding:64px 20px}
.load .mk{width:96px;margin:0 auto 28px;display:block;filter:drop-shadow(0 0 18px rgba(208,140,134,.4))}
.load p{font-family:var(--disp);font-style:italic;font-size:20px;color:var(--dim)}
.fade{animation:fade .5s ease backwards}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.pop{animation:pop .8s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.err{border:1px solid var(--rose-d);color:var(--rose);padding:13px 16px;border-radius:4px;font-size:13.5px;margin-top:20px}

#workbook{display:none}
@media print{
  body{background:#fff;color:#1a1a1a;padding:0}
  body::before,.rail,.wrap{display:none!important}
  #workbook{display:block;font-family:Georgia,serif;max-width:none}
  #workbook h1{font-size:30px;margin-bottom:4px}
  #workbook .kick{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8a7a80;margin-bottom:26px}
  #workbook h2{font-size:19px;margin:30px 0 10px;page-break-after:avoid}
  #workbook p{font-size:13.5px;line-height:1.65;color:#333;margin-bottom:11px}
  #workbook .em{font-style:italic;color:#8a5f5b;font-size:16px;margin-bottom:20px}
  #workbook .rule{border:0;border-top:1px solid #ddd;margin:26px 0}
  #workbook .prompt{page-break-inside:avoid;margin-bottom:26px}
  #workbook .prompt .qn{font-weight:bold;font-size:14px;margin-bottom:6px}
  #workbook .prompt .fr{font-size:12px;color:#777;font-style:italic;margin-bottom:12px}
  #workbook .lines div{border-bottom:1px solid #ccc;height:26px}
  #workbook .foot{margin-top:34px;font-size:11px;color:#888;text-align:center}
}

/* ══ a11y ══ */
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
h2:focus,h1:focus{outline:none}
h2:focus-visible{outline:1px solid var(--brass);outline-offset:6px;border-radius:3px}
.btn:focus-visible,.back:focus-visible,.skip:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
</style>
</head>
<body>

<a class="vh" href="#app">Skip to the audit</a>
<div class="rail" aria-hidden="true"><div class="track"><i id="railfill" style="height:0%"></i></div><div class="cap">Lit</div></div>
<div class="wrap" id="wrap">
  <header id="hd"></header>
  <main id="app"></main>
  <footer>Sex by Design<br><span style="letter-spacing:.08em;text-transform:none;font-size:11px">
    Coaching, not therapy. If you're in distress, please speak to a licensed professional.</span></footer>
</div>
<div id="workbook"></div>
<div class="vh" id="live" role="status" aria-live="polite"></div>

<script>
const CFG={
  coach:'Brianna',
  callName:'the Design Call',
  callDetail:'45 minutes, private. We take what you just named and work out whether your relationship can hold it.',
  bookingUrl:'https://calendar.app.google/W2hJzmgZ1rbXXkBP7',
  /* Paste the normal share/watch link — YouTube, Vimeo, Loom, or a direct
     .mp4/.webm file. It gets converted to a proper embed automatically, so
     you do not have to hunt for the "embed" URL. Leave '' for the placeholder.
       https://youtu.be/abc123
       https://www.youtube.com/watch?v=abc123
       https://vimeo.com/123456789
       https://www.loom.com/share/abc123
       https://cdn.yoursite.com/intro.mp4                                   */
  videoUrl:'https://www.youtube.com/shorts/s4apj-VMpwY',

  /* Same-origin endpoints inside the Next app. No CORS, no separate deploy.
     readUrl  → app/api/audit-read/route.ts   (holds ANTHROPIC_API_KEY)
     leadUrl  → app/api/audit-signup/route.ts (existing Kit pipeline)

/* ── network ─────────────────────────────────────────────────────────────── */
async function post(url,payload,{retries=CFG.retries}={}){
  if(!url)throw new Error('endpoint not configured');
  let last;
  for(let a=0;a<=retries;a++){
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),CFG.timeoutMs);
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload),signal:ctl.signal});
      if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,200));
      return await r.json();
    }catch(e){last=e;}
    finally{clearTimeout(timer);}
    if(a<retries)await new Promise(s=>setTimeout(s,1200*(a+1)));
  }
  throw last;
}

/* Part One is a second, independent signal about the same thing the items
   measure, so it is the natural tiebreak. Weights stay under 1 — they can
   only separate archetypes already level on the items, never outrank a
   real point of difference. */
const TIEBREAK={
  desire:    {G:.40,C:.15},   /* no pull at all → can't feel it / drive replaced it */
  resentment:{M:.40,S:.15},   /* it went badly once → want less, or swallow it */
  avoidance: {P:.40,G:.15},   /* both know, nobody says → the acceptable answer */
  incompat:  {C:.40,P:.15},   /* reads it structurally → solves it / looks right on paper */
  truth:     {S:.40,M:.15}    /* never stated the want → lost it, or downgraded it */
  /* Each archetype carries identical total weight (0.55) across the five
     blocks, so Part One separates people without favouring anyone. */
};
/* Anything still level after that is a genuine tie. Rotating the starting
   point by a hash of the answers spreads those evenly across the five
   instead of handing every one of them to whoever sorts first, while
   keeping the result stable: same answers in, same archetype out. */
function rotation(){
  let h=0;
  Object.keys(S.checks).forEach(i=>{if(S.checks[i])h=(h*31+Number(i)+7)>>>0;});
  S.blocks.forEach(b=>{for(const ch of b)h=(h*31+ch.charCodeAt(0))>>>0;});
  return h%5;
}
function score(){
  const t={P:0,S:0,C:0,G:0,M:0};
  Object.keys(S.checks).forEach(i=>{if(S.checks[i])t[ITEMS[i][0]]++;});

  const bonus={P:0,S:0,C:0,G:0,M:0};
  S.blocks.forEach(b=>{const w=TIEBREAK[b];
    if(w)Object.keys(w).forEach(k=>{bonus[k]+=w[k];});});

  const base=['P','S','C','G','M'], r0=rotation();
  const order=base.slice(r0).concat(base.slice(0,r0));
  const rank=order.map(k=>[k,t[k]])
    .sort((a,b)=>(t[b[0]]+bonus[b[0]])-(t[a[0]]+bonus[a[0]]));

  return{t,bonus,primary:rank[0][0],
    secondary:rank[1][1]>=rank[0][1]-1&&rank[1][1]>0?rank[1][0]:null,rank};
}

/* Resend anything a previous session failed to deliver. */
function flushPendingLead(){

/* Accept the model's JSON only if it is actually usable. A half-formed
   response is worse than the fallback, because it looks personalised
   and reads as nonsense. */
const AI_KEYS=['letter','costing','read','sentence'];
function normalizeAI(d){
  if(!d||typeof d!=='object')return null;
  const out={};
  for(const k of AI_KEYS){
    const v=d[k];
    if(typeof v!=='string')return null;
    const t=v.trim();
    if(t.length<40&&k!=='sentence')return null;
    if(t.length<12)return null;
    out[k]=t;
  }
  if(out.sentence.length>320)return null;
  return out;
}

async function build(){

  let ai=null;

    if(!ai)console.warn('read returned an unusable shape; using fallback');
  }catch(e){
    console.error('read failed →',e);
  }
  if(!ai)ai=fb(sc);
  await leadPromise.catch(()=>{});       /* never let capture block the result */
  S.plan={sc,ai};S.step=100;render();
}

/* ══ video ═════════════════════════════════════════════════════════════════
   Turns an ordinary share link into a working embed. Pasting a watch/share
   URL straight into an iframe is the usual reason a video shows up blank,
   so the conversion happens here rather than in your head. */
function videoEmbed(raw){
  const url=String(raw||'').trim();
  /* A Short is vertical; so is anything you flag with #portrait. */
  const portrait=/youtube\.com\/shorts\//i.test(url)||/#portrait\b/i.test(url);
  const wrap=h=>({html:h,portrait});
  if(!url)return wrap(`<div class="vidph"><div><div class="pl"></div>
      <p>[ EMBED VIDEO — set CFG.videoUrl ]</p></div></div>`);

  /* A file you host yourself — served as a real player, not an iframe. */
  if(/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url))
    return wrap(`<video controls playsinline preload="metadata"
      src="${esc(url.replace(/#portrait\b/i,''))}">Your browser can't play this video.</video>`);

  let src='';
  let m;
  /* YouTube: watch?v= / youtu.be / shorts / already-an-embed */
  if((m=url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{6,})/)))
    src=`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&modestbranding=1`;
  /* Vimeo: vimeo.com/ID, optionally with a /HASH for unlisted videos */
  else if((m=url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([\w]+))?/)))
    src=`https://player.vimeo.com/video/${m[1]}${m[2]?'?h='+m[2]:''}`;
  /* Loom: /share/ID or /embed/ID */
  else if((m=url.match(/loom\.com\/(?:share|embed)\/([\w-]+)/)))
    src=`https://www.loom.com/embed/${m[1]}`;
